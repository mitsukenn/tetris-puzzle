<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cdeafd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="テトパズ">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>テトリスパズル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: linear-gradient(160deg, #cdeafd 0%, #e6f1fb 45%, #fbd8e8 100%);
    color: #6b7a99;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ===== ヘッダー（スコア） ===== */
  #header {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 4px;
  }
  .score-box {
    text-align: center;
    flex: 1;
  }
  .score-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #96a8c8;
    text-transform: uppercase;
  }
  .score-value {
    font-size: 26px;
    font-weight: 700;
    color: #f286ac;
    text-shadow: 0 2px 8px rgba(242, 134, 172, 0.3);
  }
  #best-value { color: #5eb3e4; text-shadow: 0 2px 8px rgba(94, 179, 228, 0.3); }
  #title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #f286ac, #f7b267, #6fcf97, #5eb3e4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    flex: 1;
    text-align: center;
  }

  /* ===== コンボ表示 ===== */
  #combo-banner {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #f2749f;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 2px 10px rgba(242, 116, 159, 0.4);
  }
  #combo-banner.show { opacity: 1; animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(0.6); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ===== 盤面 ===== */
  #board-wrap {
    position: relative;
    margin: 2px auto 0;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    gap: var(--gap);
    background: rgba(255, 255, 255, 0.55);
    padding: var(--gap);
    border-radius: 12px;
    box-shadow: inset 0 2px 8px rgba(122, 161, 209, 0.2), 0 4px 20px rgba(122, 161, 209, 0.25);
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    background: rgba(122, 161, 209, 0.14);
    border-radius: 6px;
    position: relative;
    transition: background 0.12s;
  }
  .cell.filled {
    background: var(--c);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.3);
  }
  .cell.preview {
    background: var(--c);
    opacity: 0.4;
  }
  .cell.will-clear {
    animation: glow 0.5s ease infinite alternate;
  }
  @keyframes glow {
    from { filter: brightness(1); }
    to { filter: brightness(1.6); box-shadow: 0 0 12px rgba(255,255,255,0.7); }
  }
  .cell.clearing {
    animation: vanish 0.3s ease forwards;
  }
  @keyframes vanish {
    to { transform: scale(0); opacity: 0; }
  }

  /* ===== ピーストレイ ===== */
  #tray {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 14px 8px;
    min-height: calc(var(--tray-cell) * 4 + 40px);
  }
  .piece {
    display: grid;
    gap: 2px;
    cursor: grab;
    transition: transform 0.15s, opacity 0.2s;
    touch-action: none;
  }
  .piece.dragging { opacity: 0; }
  .piece.used { visibility: hidden; }
  .piece.unplaceable { opacity: 0.3; filter: grayscale(0.7); }
  .piece-cell {
    width: var(--tray-cell);
    height: var(--tray-cell);
    border-radius: 4px;
  }
  .piece-cell.on {
    background: var(--c);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  /* ===== ドラッグ中のゴースト ===== */
  #drag-ghost {
    position: fixed;
    display: grid;
    gap: var(--gap);
    pointer-events: none;
    z-index: 100;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  }
  #drag-ghost .ghost-cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 6px;
  }
  #drag-ghost .ghost-cell.on {
    background: var(--c);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.3);
  }

  /* ===== スコアポップ ===== */
  .score-pop {
    position: fixed;
    font-size: 22px;
    font-weight: 700;
    color: #f2749f;
    text-shadow: 0 1px 0 #fff, 0 2px 8px rgba(242, 116, 159, 0.5);
    pointer-events: none;
    z-index: 200;
    animation: rise 0.9s ease forwards;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.7); }
    20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1); }
  }

  /* ===== ゲームオーバー ===== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(230, 240, 250, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    backdrop-filter: blur(5px);
  }
  #overlay.show { display: flex; }
  .overlay-card {
    background: linear-gradient(160deg, #ffffff, #f2f7fd);
    border: 1px solid rgba(122, 161, 209, 0.25);
    border-radius: 20px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(122, 161, 209, 0.35);
    animation: pop 0.4s ease;
  }
  .overlay-card h2 { font-size: 24px; margin-bottom: 12px; color: #f2749f; }
  .overlay-card .final-score { font-size: 40px; font-weight: 700; color: #f286ac; margin-bottom: 4px; }
  .overlay-card .final-label { font-size: 12px; color: #96a8c8; margin-bottom: 6px; }
  .overlay-card .best-note { font-size: 14px; color: #5eb3e4; margin-bottom: 20px; min-height: 20px; }
  #restart-btn {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    border: none;
    border-radius: 999px;
    padding: 12px 36px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(242, 134, 172, 0.4);
    transition: transform 0.1s;
  }
  #restart-btn:active { transform: scale(0.95); }
  .overlay-btns { display: flex; gap: 10px; justify-content: center; }
  #menu-btn {
    font-size: 15px;
    font-weight: 700;
    color: #5eb3e4;
    background: #fff;
    border: 1px solid rgba(94, 179, 228, 0.5);
    border-radius: 999px;
    padding: 12px 24px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #menu-btn:active { transform: scale(0.95); }
  #peek-btn {
    font-size: 13px;
    font-weight: 700;
    color: #96a8c8;
    background: transparent;
    border: none;
    text-decoration: underline;
    padding: 12px 8px 0;
    cursor: pointer;
    display: block;
    margin: 0 auto;
  }
  #peek-btn:active { opacity: 0.6; }
  /* 盤面を見ている間に表示する「結果にもどる」バー */
  #back-to-result {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: none;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
    z-index: 310;
    box-shadow: 0 4px 18px rgba(242, 134, 172, 0.5);
    animation: pop 0.35s ease;
  }
  #back-to-result.show { display: block; }
  #back-to-result:active { transform: translateX(-50%) scale(0.95); }
  .overlay-card .mode-line { font-size: 13px; color: #96a8c8; margin-bottom: 8px; }
  .mode-line-icon { width: 20px; height: 20px; border-radius: 6px; vertical-align: -5px; margin-right: 4px; }
  .clear-badge {
    display: inline-block;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 10px;
  }
  .unlock-note { font-size: 13px; color: #f2749f; margin-bottom: 14px; }

  /* ===== ホームボタン ===== */
  #home-btn {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(122, 161, 209, 0.3);
    border-radius: 12px;
    padding: 5px 7px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(122, 161, 209, 0.2);
    line-height: 0;
  }
  #home-btn img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
  }
  #home-btn:active { transform: scale(0.92); }
  #sound-btn {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(122, 161, 209, 0.3);
    border-radius: 12px;
    padding: 5px 7px;
    margin-left: 6px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(122, 161, 209, 0.2);
    line-height: 0;
  }
  #sound-btn img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
  }
  #sound-btn.muted { opacity: 0.7; }
  #sound-btn:active { transform: scale(0.92); }

  /* ===== タイマー表示 ===== */
  #title.timer-mode {
    background: none;
    -webkit-text-fill-color: #5a6a85;
    font-size: 24px;
  }
  #title.urgent {
    -webkit-text-fill-color: #e05575;
    animation: pulseTimer 1s ease infinite;
  }
  @keyframes pulseTimer {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* ===== 消去エフェクト（パーティクル・コンボ演出） ===== */
  .particle {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--c);
    pointer-events: none;
    z-index: 220;
    animation: particleFly 0.7s ease-out forwards;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(var(--rot)); opacity: 0; }
  }
  #combo-pop {
    position: fixed;
    top: 34%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 34px;
    font-weight: 900;
    color: #ff7ba3;
    white-space: nowrap;
    pointer-events: none;
    z-index: 260;
    opacity: 0;
    text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(242, 116, 159, 0.55);
  }
  #combo-pop.show { animation: comboPop 1s ease forwards; }
  #combo-pop img {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    vertical-align: -8px;
    margin-right: 6px;
  }
  #combo-banner img {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    vertical-align: -5px;
    margin: 0 3px;
  }
  #toast img {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    vertical-align: -6px;
    margin-right: 5px;
  }
  .clear-badge img {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    vertical-align: -4px;
    margin-right: 4px;
  }
  .rank-no img {
    width: 26px;
    height: 26px;
    vertical-align: -7px;
  }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-6deg); }
    22% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(3deg); }
    40% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -75%) scale(1.05); }
  }
  .board-shake { animation: boardShake 0.35s ease; }
  @keyframes boardShake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, 2px); }
  }

  /* ===== トースト ===== */
  #toast {
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.92);
    color: #f2749f;
    font-size: 19px;
    font-weight: 700;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(122, 161, 209, 0.4);
    z-index: 250;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; animation: pop 0.4s ease; }

  /* ===== モード選択画面 ===== */
  #menu {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #cdeafd 0%, #e6f1fb 45%, #fbd8e8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 400;
    overflow-y: auto;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  #menu.hidden { display: none; }
  #title-logo {
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 6px auto 0;
    display: block;
    mix-blend-mode: multiply;   /* 白背景をパステル背景になじませる */
  }
  #menu .menu-sub { font-size: 12px; color: #96a8c8; margin: -4px 0 18px; }
  #mode-list { width: 100%; max-width: 360px; }
  .mode-card {
    width: 100%;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(122, 161, 209, 0.3);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(122, 161, 209, 0.2);
    transition: transform 0.1s;
  }
  .mode-card:active { transform: scale(0.97); }
  .mode-card .mode-icon { font-size: 30px; }
  .mode-card .mode-info { flex: 1; }
  .mode-card .mode-name { font-size: 16px; font-weight: 700; color: #5a6a85; }
  .mode-card .mode-desc { font-size: 11px; color: #96a8c8; margin-top: 2px; }
  .mode-card .mode-stats { font-size: 11px; color: #5eb3e4; margin-top: 4px; }
  .mode-card.locked { opacity: 0.65; }
  .mode-card.locked .mode-icon { filter: grayscale(1); }
  .mode-card.locked .mode-desc { color: #d98aa8; }
  #resume-btn {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    border: none;
    border-radius: 999px;
    padding: 12px 32px;
    margin-top: 6px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(242, 134, 172, 0.4);
  }
  #resume-btn:active { transform: scale(0.95); }
  #stats-btn {
    font-size: 14px;
    font-weight: 700;
    color: #5eb3e4;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(94, 179, 228, 0.4);
    border-radius: 999px;
    padding: 8px 26px;
    margin-top: 4px;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(122, 161, 209, 0.2);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  #stats-btn img {
    width: 24px;
    height: 24px;
    border-radius: 7px;
  }
  #stats-btn:active { transform: scale(0.95); }
  .stats-title-icon {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    vertical-align: -5px;
  }
  .mode-icon-img {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(122, 161, 209, 0.3);
    flex-shrink: 0;
  }
  .mode-card.locked .mode-icon-img { filter: grayscale(1); }

  /* ===== スコア記録（グラフ） ===== */
  #stats {
    position: fixed;
    inset: 0;
    background: rgba(230, 240, 250, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 450;
    backdrop-filter: blur(5px);
  }
  #stats.hidden { display: none; }
  .stats-card {
    background: linear-gradient(160deg, #ffffff, #f2f7fd);
    border: 1px solid rgba(122, 161, 209, 0.25);
    border-radius: 20px;
    padding: 22px 20px 18px;
    width: calc(100% - 32px);
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(122, 161, 209, 0.35);
    animation: pop 0.4s ease;
  }
  .stats-card h2 { font-size: 19px; color: #5a6a85; margin-bottom: 4px; }
  .stats-sub { font-size: 11px; color: #96a8c8; margin-bottom: 14px; }
  .chart-chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .chart-chip {
    font-size: 11px;
    font-weight: 700;
    color: #96a8c8;
    background: rgba(122, 161, 209, 0.12);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 10px 4px 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chart-chip[data-f="all"] { padding: 4px 12px; }
  .chart-chip img {
    width: 20px;
    height: 20px;
    border-radius: 6px;
  }
  .chart-chip.active {
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
  }
  #chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    height: 185px;
    margin-bottom: 14px;
  }
  .chart-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    width: 40px;
  }
  .chart-val { font-size: 10px; font-weight: 700; color: #f286ac; min-height: 13px; }
  .chart-bar {
    width: 26px;
    border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #8ecdf0, #b8dcf5);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
    transition: height 0.3s ease;
  }
  .chart-col.today .chart-bar { background: linear-gradient(180deg, #f7a8c4, #fbd0e0); }
  .chart-day { font-size: 10px; color: #96a8c8; line-height: 1.3; }
  .chart-col.today .chart-day { color: #f286ac; font-weight: 700; }
  #stats-close {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    border: none;
    border-radius: 999px;
    padding: 10px 32px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(242, 134, 172, 0.4);
  }
  #stats-close:active { transform: scale(0.95); }

  /* ===== スコア登録（ゲームオーバー画面内） ===== */
  #register-box {
    display: none;
    background: linear-gradient(135deg, #fff6fa, #f2f8fd);
    border: 1px dashed rgba(242, 134, 172, 0.55);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  #register-box.show { display: block; }
  .register-title { font-size: 13px; font-weight: 700; color: #f2749f; margin-bottom: 8px; }
  #name-input {
    width: 100%;
    font-size: 16px; /* iOSの自動ズーム防止 */
    font-family: inherit;
    color: #5a6a85;
    text-align: center;
    background: #fff;
    border: 1px solid rgba(122, 161, 209, 0.4);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  #name-input:focus { outline: 2px solid rgba(142, 205, 240, 0.8); }
  #register-btn {
    width: 100%;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #f7a8c4, #8ecdf0);
    border: none;
    border-radius: 999px;
    padding: 11px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(242, 134, 172, 0.35);
  }
  #register-btn:active { transform: scale(0.97); }
  #register-btn:disabled { opacity: 0.5; }

<script>
(() => {
  'use strict';

  const SIZE = 8;

  // ===== レイアウト計算（画面幅に合わせてセルサイズを決定） =====
  function layout() {
    const vw = Math.min(window.innerWidth, 440);
    const vh = window.innerHeight;
    // 盤面は幅の 88% か、高さの 50% に収まるサイズ
    const bySide = Math.floor((vw * 0.88 - 9 * 4) / 8);
    const byHeight = Math.floor((vh * 0.5 - 9 * 4) / 8);
    const cell = Math.max(24, Math.min(bySide, byHeight));
    document.documentElement.style.setProperty('--cell', cell + 'px');
    document.documentElement.style.setProperty('--gap', '4px');
    document.documentElement.style.setProperty('--tray-cell', Math.floor(cell * 0.55) + 'px');
    return cell;
  }
  let CELL = layout();
  window.addEventListener('resize', () => { CELL = layout(); });

  // ===== 効果音（Web Audio・音声ファイル不要） =====
  const SND_KEY = 'tp_sound';
  let soundOn = localStorage.getItem(SND_KEY) !== 'off';
  let audioCtx = null;

  function ac() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // 単音を鳴らす（freq: 周波数, dur: 長さ秒）
  function tone(freq, dur, opt = {}) {
    if (!soundOn) return;
    try {
      const ctx = ac();
      const t0 = ctx.currentTime + (opt.delay || 0);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = opt.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (opt.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + opt.slide), t0 + dur);
      const vol = opt.vol || 0.2;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) { /* 音は失敗しても無視 */ }
  }

  const SFX = {
    pick()  { tone(500, 0.06, { type: 'triangle', vol: 0.1 }); },
    place() { tone(300, 0.09, { type: 'triangle', vol: 0.25, slide: -80 }); tone(520, 0.06, { vol: 0.12, delay: 0.02 }); },
    clear(lines, comboCount) {
      // コンボが続くほどキーが上がる、明るい駆け上がりアルペジオ
      const c = Math.min(comboCount, 8);
      const base = 440 * Math.pow(1.12, c);
      const steps = [0, 4, 7, 12, 16, 19, 24, 28]; // メジャーコードの積み上げ
      const n = Math.min(3 + lines + Math.min(c, 3), 8);
      for (let i = 0; i < n; i++) {
        const f = base * Math.pow(2, steps[i] / 12);
        tone(f, 0.13, { type: 'triangle', vol: 0.18, delay: i * 0.045 });
        tone(f * 2, 0.1, { vol: 0.05, delay: i * 0.045 }); // きらめきレイヤー
      }
      tone(base * 4, 0.3, { vol: 0.12, delay: n * 0.045 }); // 最後にキラーン
      if (lines >= 2) tone(base * 2, 0.35, { vol: 0.14, delay: n * 0.045 + 0.04, slide: 400 }); // 同時消しは上昇スライド追加
    },
    goal()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, { vol: 0.22, delay: i * 0.1 })); },
    unlock() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, { vol: 0.2, delay: i * 0.08 })); },
    over()   { [392, 311, 247, 175].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.15, delay: i * 0.16 })); },
    timeup() { tone(880, 0.35, { vol: 0.2 }); tone(587, 0.5, { vol: 0.2, delay: 0.18 }); },
    tick()   { tone(1050, 0.05, { type: 'square', vol: 0.06 }); },
    tap()    { tone(600, 0.05, { type: 'triangle', vol: 0.1 }); },
  };

  const soundBtn = document.getElementById('sound-btn');
  const soundImg = document.getElementById('sound-img');
  function updateSoundBtn() {
    soundImg.src = soundOn ? 'icon-sound-on.webp' : 'icon-sound-off.webp';
    soundImg.alt = soundOn ? '効果音オン' : '効果音オフ';
    soundBtn.classList.toggle('muted', !soundOn);
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem(SND_KEY, soundOn ? 'on' : 'off');
    updateSoundBtn();
    if (soundOn) SFX.tap();
  });
  updateSoundBtn();

  // ===== ピース定義（テトリミノ中心＋補助ピース） =====
  // shape: [row, col] の配列 / g: グループ（tetro=4マス, small=1〜3マス, big=大型）
  const SHAPES = [
    // --- テトリミノ（4マス）: 出現率高め ---
    { cells: [[0,0],[0,1],[0,2],[0,3]], color: '#4fc3f7', w: 3, g: 'tetro' }, // I 横
    { cells: [[0,0],[1,0],[2,0],[3,0]], color: '#4fc3f7', w: 3, g: 'tetro' }, // I 縦
    { cells: [[0,0],[0,1],[1,0],[1,1]], color: '#ffd54f', w: 3, g: 'tetro' }, // O
    { cells: [[0,0],[0,1],[0,2],[1,1]], color: '#ba68c8', w: 2, g: 'tetro' }, // T
    { cells: [[1,0],[0,1],[1,1],[2,1]], color: '#ba68c8', w: 2, g: 'tetro' }, // T 右
    { cells: [[0,1],[1,0],[1,1],[1,2]], color: '#ba68c8', w: 2, g: 'tetro' }, // T 上
    { cells: [[0,0],[1,0],[2,0],[1,1]], color: '#ba68c8', w: 2, g: 'tetro' }, // T 左
    { cells: [[0,1],[0,2],[1,0],[1,1]], color: '#81c784', w: 2, g: 'tetro' }, // S
    { cells: [[0,0],[1,0],[1,1],[2,1]], color: '#81c784', w: 2, g: 'tetro' }, // S 縦
    { cells: [[0,0],[0,1],[1,1],[1,2]], color: '#e57373', w: 2, g: 'tetro' }, // Z
    { cells: [[0,1],[1,0],[1,1],[2,0]], color: '#e57373', w: 2, g: 'tetro' }, // Z 縦
    { cells: [[0,0],[1,0],[2,0],[2,1]], color: '#ffb74d', w: 2, g: 'tetro' }, // L
    { cells: [[0,0],[0,1],[0,2],[1,0]], color: '#ffb74d', w: 2, g: 'tetro' }, // L 回転
    { cells: [[0,0],[0,1],[1,1],[2,1]], color: '#ffb74d', w: 2, g: 'tetro' }, // L 回転
    { cells: [[1,0],[1,1],[1,2],[0,2]], color: '#ffb74d', w: 2, g: 'tetro' }, // L 回転
    { cells: [[0,1],[1,1],[2,1],[2,0]], color: '#7986cb', w: 2, g: 'tetro' }, // J
    { cells: [[0,0],[1,0],[1,1],[1,2]], color: '#7986cb', w: 2, g: 'tetro' }, // J 回転
    { cells: [[0,0],[0,1],[1,0],[2,0]], color: '#7986cb', w: 2, g: 'tetro' }, // J 回転
    { cells: [[0,0],[0,1],[0,2],[1,2]], color: '#7986cb', w: 2, g: 'tetro' }, // J 回転
    // --- 補助ピース（詰み防止・戦略用） ---
    { cells: [[0,0]], color: '#f06292', w: 1.2, g: 'small' },                    // 1マス
    { cells: [[0,0],[0,1]], color: '#4db6ac', w: 1.5, g: 'small' },              // 2マス横
    { cells: [[0,0],[1,0]], color: '#4db6ac', w: 1.5, g: 'small' },              // 2マス縦
    { cells: [[0,0],[0,1],[0,2]], color: '#aed581', w: 1.5, g: 'small' },        // 3マス横
    { cells: [[0,0],[1,0],[2,0]], color: '#aed581', w: 1.5, g: 'small' },        // 3マス縦
    { cells: [[0,0],[0,1],[1,0]], color: '#ff8a65', w: 1.5, g: 'small' },        // 角3マス
    { cells: [[0,0],[0,1],[1,1]], color: '#ff8a65', w: 1.5, g: 'small' },        // 角3マス
    { cells: [[0,0],[1,0],[1,1]], color: '#ff8a65', w: 1.5, g: 'small' },        // 角3マス
    { cells: [[0,1],[1,0],[1,1]], color: '#ff8a65', w: 1.5, g: 'small' },        // 角3マス
    { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], color: '#9575cd', w: 0.7, g: 'big' }, // 3×3
    { cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], color: '#64b5f6', w: 0.8, g: 'big' }, // 5マス横
    { cells: [[0,0],[1,0],[2,0],[3,0],[4,0]], color: '#64b5f6', w: 0.8, g: 'big' }, // 5マス縦
  ];

  // ===== モード定義 =====
  const MODES = {
    normal: {
      name: '通常', icon: '🧩', img: 'mode-normal.webp', titleHtml: '🧩 テトリス<br>パズル',
      desc: 'じっくりハイスコアを狙おう',
      clearTarget: 1000, timeLimit: 0, obstacles: 0,
      weights: { tetro: 1, small: 1, big: 1 },
      unlock: null,
    },
    timeattack: {
      name: 'タイムアタック', icon: '⏱️', img: 'mode-timeattack.webp', titleHtml: '⏱️ タイム<br>アタック',
      desc: '3分間でどこまで稼げる？',
      clearTarget: 600, timeLimit: 180, obstacles: 0,
      weights: { tetro: 1, small: 1, big: 1 },
      unlock: { count: 3 },
    },
    hard: {
      name: 'ハード', icon: '🔥', img: 'mode-hard.webp', titleHtml: '🔥 ハード<br>モード',
      desc: '小さいピースが出にくい',
      clearTarget: 1000, timeLimit: 0, obstacles: 0,
      weights: { tetro: 1, small: 0.35, big: 1.4 },
      unlock: { count: 5 },
    },
    veryhard: {
      name: 'ベリーハード', icon: '💀', img: 'mode-veryhard.webp', titleHtml: '💀 ベリー<br>ハード',
      desc: '大型ピース＋お邪魔ブロック',
      clearTarget: 1000, timeLimit: 0, obstacles: 10,
      weights: { tetro: 1, small: 0, big: 1.8 },
      unlock: { count: 10 },
    },
  };

  function randomShape() {
    const mw = MODES[mode].weights;
    const pool = SHAPES.map(s => ({ s, w: s.w * (mw[s.g] ?? 1) })).filter(p => p.w > 0);
    const total = pool.reduce((a, p) => a + p.w, 0);
    let r = Math.random() * total;
    for (const p of pool) {
      r -= p.w;
      if (r <= 0) return p.s;
    }
    return pool[0].s;
  }

  // ===== 状態 =====
  let grid = [];        // grid[r][c] = null | color
  let tray = [];        // { shape, el, used }
  let score = 0;
  let combo = 0;
  let gameOver = false;
  let mode = 'normal';
  let clearAchieved = false;   // このゲームでクリア達成済みか
  let unlockedMsgs = [];       // このゲームで解放されたモード名
  let timeLeft = 0;
  let timerId = null;
  let remainingMs = 0;   // 一時停止中に保持する残り時間
  let deadline = 0;      // タイムアタックの期限（エポックms）
  let paused = false;
  let gameActive = false;

  const boardEl = document.getElementById('board');

  const overlayEl = document.getElementById('overlay');

  // ===== モード別成績（クリア回数・ベストスコア） =====
  const STATS_KEY = 'tp_stats';
  function loadStats() {
    let s;
    try { s = JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { s = {}; }
    for (const k of Object.keys(MODES)) s[k] = Object.assign({ clears: 0, best: 0 }, s[k]);
    // 旧バージョンのベストスコアを引き継ぐ
    const old = Number(localStorage.getItem('tetris-puzzle-best') || 0);
    if (old > s.normal.best) s.normal.best = old;
    return s;
  }
  const stats = loadStats();
  function saveStats() { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }
  // 全モード合計のクリア回数（どのモードで遊んでも解放条件に加算される）
  function totalClears() {
    return Object.keys(MODES).reduce((s, k) => s + (stats[k] ? stats[k].clears : 0), 0);
  }

  function isUnlocked(k) {
    const u = MODES[k].unlock;
    return !u || totalClears() >= u.count;
  }

  // ===== 日別ベストスコア記録 =====
  const DAILY_KEY = 'tp_daily';
  function dateKeyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadDaily() {
    let d;
    try { d = JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch (e) { d = {}; }
    // 30日より古い記録は削除
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    for (const k of Object.keys(d)) {
      if (new Date(k + 'T00:00:00') < cutoff) delete d[k];
    }
    return d;
  }
  const daily = loadDaily();
  function recordDaily() {
    if (score <= 0) return;
    const k = dateKeyOf(new Date());
    if (!daily[k]) daily[k] = {};
    if (score > (daily[k][mode] || 0)) {
      daily[k][mode] = score;
      localStorage.setItem(DAILY_KEY, JSON.stringify(daily));
    }
  }

  // ===== スコア記録グラフ（過去7日） =====
  let chartFilter = 'all';
  function renderChart() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const rec = daily[dateKeyOf(d)] || {};
      const vals = Object.values(rec);
      const val = chartFilter === 'all'
        ? (vals.length ? Math.max(...vals) : 0)
        : (rec[chartFilter] || 0);
      days.push({
        label: (d.getMonth() + 1) + '/' + d.getDate(),
        dow: '日月火水木金土'[d.getDay()],
        val,
        isToday: i === 0,
      });
    }
    const max = Math.max(1, ...days.map(d => d.val));
    document.getElementById('chart-bars').innerHTML = days.map(d => `
      <div class="chart-col${d.isToday ? ' today' : ''}">
        <div class="chart-val">${d.val || ''}</div>
        <div class="chart-bar" style="height:${d.val ? Math.max(8, Math.round(d.val / max * 130)) : 4}px"></div>
        <div class="chart-day">${d.label}<br>${d.dow}</div>
      </div>`).join('');
    document.querySelectorAll('.chart-chip[data-f]').forEach(ch =>
      ch.classList.toggle('active', ch.dataset.f === chartFilter));
  }

  // ===== ランキング（スコア登録・ログイン不要） =====
  // オンライン共有ランキングのAPI（Google Apps ScriptのウェブアプリURL）。
  // 空文字にすると「この端末だけ」のランキングとして動作する。
  const RANKING_API = 'https://script.google.com/macros/s/AKfycbydteWLmZmW48GksKOdtj0WF3gafADX99-H5f8gDKyx5VPY_tDZ_rKj-w9aXMw6JcUR/exec';
  const RANK_KEY = 'tp_ranking';
  const NAME_KEY = 'tp_last_name';
  const RANK_MAX = 20;

  let rankFilter = 'normal';
  let myEntryKey = null;   // 直前に登録した自分の行をハイライトする用
  let prevBest = 0;        // ゲーム開始時点のベスト（自己ベスト更新の判定用）

  const rankingEl = document.getElementById('ranking');
  const rankListEl = document.getElementById('rank-list');
  const rankStatusEl = document.getElementById('rank-status');
  const registerBox = document.getElementById('register-box');
  const nameInput = document.getElementById('name-input');
  const registerBtn = document.getElementById('register-btn');

  // 名前は必ずエスケープして表示する（オンライン化した際のXSS対策）
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function loadLocalRank() {
    try { return JSON.parse(localStorage.getItem(RANK_KEY)) || {}; } catch (e) { return {}; }
  }
  function localRankOf(m) {
    const all = loadLocalRank();
    return (all[m] || []).slice().sort((a, b) => b.score - a.score).slice(0, RANK_MAX);
  }
  function addLocalRank(entry) {
    const all = loadLocalRank();
    if (!all[entry.mode]) all[entry.mode] = [];
    all[entry.mode].push(entry);
    all[entry.mode].sort((a, b) => b.score - a.score);
    all[entry.mode] = all[entry.mode].slice(0, RANK_MAX);
    localStorage.setItem(RANK_KEY, JSON.stringify(all));
  }

  // 登録できる条件：自己ベスト更新、またはランキング圏内
  function canRegister() {
    if (score <= 0) return false;
    if (score > prevBest) return true;
    const list = localRankOf(mode);
    return list.length < RANK_MAX || score > list[list.length - 1].score;
  }

  async function fetchOnlineRank(m) {
    const res = await fetch(RANKING_API + '?mode=' + encodeURIComponent(m), { cache: 'no-store' });
    const data = await res.json();
    return Array.isArray(data) ? data : (data.entries || []);
  }

  async function postOnlineRank(entry) {
    // Content-Type を text/plain にすると CORS プリフライトが飛ばない（GAS は OPTIONS に応答できない）
    await fetch(RANKING_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(entry),
    });
  }

  function renderRankList(list, statusText) {
    rankStatusEl.textContent = statusText || '';
    if (!list || !list.length) {
      rankListEl.innerHTML = '<div class="rank-empty">まだ記録がありません。<br>いちばん乗りを目指そう！</div>';
      return;
    }
    rankListEl.innerHTML = list.slice(0, RANK_MAX).map((en, i) => {
      const medalImg = [IMG.gold, IMG.silver, IMG.bronze][i];
      const medal = medalImg ? icon(medalImg) : (i + 1);
      const mine = myEntryKey && (en.name + '|' + en.score) === myEntryKey ? ' mine' : '';
      let d = '';
      if (en.date) {
        const dt = new Date(en.date);
        if (!isNaN(dt)) d = (dt.getMonth() + 1) + '/' + dt.getDate();
      }
      return `<div class="rank-row${mine}">` +
        `<span class="rank-no">${medal}</span>` +
        `<span class="rank-name">${esc(en.name || 'ななし')}</span>` +
        `<span class="rank-score">${Number(en.score) || 0}</span>` +
        `<span class="rank-date">${d}</span>` +
        `</div>`;
    }).join('');
  }

  async function openRanking(m) {
    if (m) rankFilter = m;
    rankingEl.classList.remove('hidden');
    document.querySelectorAll('.chart-chip[data-m]').forEach(ch =>
      ch.classList.toggle('active', ch.dataset.m === rankFilter));
    // まず端末内の記録をすぐ表示（オンラインは後から上書き）
    renderRankList(localRankOf(rankFilter),
      RANKING_API ? '読み込み中…' : 'この端末に保存された記録です');
    if (!RANKING_API) return;
    try {
      const entries = await fetchOnlineRank(rankFilter);
      renderRankList(entries, 'みんなのランキング');
    } catch (err) {
      renderRankList(localRankOf(rankFilter), '⚠️ 通信できないため、この端末の記録を表示中です');
    }
  }

  function maybeShowRegister() {
    if (!canRegister()) {
      registerBox.classList.remove('show');
      return;
    }
    document.getElementById('register-title').textContent =
      score > prevBest ? '🏆 自己ベスト更新！ランキングに登録しよう' : '🏆 ランキング圏内！登録できます';
    nameInput.value = localStorage.getItem(NAME_KEY) || '';
    registerBtn.disabled = false;
    registerBtn.textContent = 'この名前で登録する';
    registerBox.classList.add('show');
  }

  registerBtn.addEventListener('click', async () => {
    const name = (nameInput.value || '').trim().slice(0, 12) || 'ななし';
    localStorage.setItem(NAME_KEY, name);
    const entry = { name, score, mode, date: new Date().toISOString() };
    myEntryKey = name + '|' + score;
    registerBtn.disabled = true;
    registerBtn.textContent = '登録中…';
    addLocalRank(entry);
    if (RANKING_API) {
      try { await postOnlineRank(entry); } catch (err) { /* 失敗しても端末内には残る */ }
    }
    SFX.goal();
    registerBox.classList.remove('show');
    overlayEl.classList.remove('show');
    rankFromResult = true;
    openRanking(mode);
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); registerBtn.click(); }
  });

  let rankFromResult = false;   // 結果画面からランキングを開いたか
  document.getElementById('ranking-btn').addEventListener('click', () => {
    SFX.tap();
    rankFromResult = false;
    myEntryKey = null;
    openRanking(mode);
  });
  document.getElementById('rank-close').addEventListener('click', () => {
    rankingEl.classList.add('hidden');
    myEntryKey = null;
    // 結果画面から開いていた場合は結果に戻す
    if (rankFromResult) {
      rankFromResult = false;
      overlayEl.classList.add('show');
    }
  });
  document.querySelectorAll('.chart-chip[data-m]').forEach(ch => {
    ch.addEventListener('click', () => openRanking(ch.dataset.m));
  });

  // ===== ゲームオーバー後に最後の盤面を確認する =====
  const backToResultBtn = document.getElementById('back-to-result');
  document.getElementById('peek-btn').addEventListener('click', () => {
    SFX.tap();
    overlayEl.classList.remove('show');
    backToResultBtn.classList.add('show');
  });
  backToResultBtn.addEventListener('click', () => {
    SFX.tap();
    backToResultBtn.classList.remove('show');
    overlayEl.classList.add('show');
  });

  const cellEls = [];
  for (let r = 0; r < SIZE; r++) {
    cellEls.push([]);
    for (let c = 0; c < SIZE; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      boardEl.appendChild(el);
      cellEls[r].push(el);
    }
  }

  function resetGrid() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function renderBoard(previewCells = [], previewColor = '', willClear = new Set()) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = cellEls[r][c];
        el.className = 'cell';
        el.style.removeProperty('--c');
        if (grid[r][c]) {
          el.classList.add('filled');
          el.style.setProperty('--c', grid[r][c]);
          if (willClear.has(r + ',' + c)) el.classList.add('will-clear');
        }
      }
    }
    for (const [r, c] of previewCells) {
      const el = cellEls[r][c];
      if (!grid[r][c]) {
        el.classList.add('preview');
        el.style.setProperty('--c', previewColor);
      }
      if (willClear.has(r + ',' + c)) {
        el.classList.add('preview', 'will-clear');
        el.style.setProperty('--c', previewColor);
      }
    }
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > stats[mode].best) {
      stats[mode].best = score;
      saveStats();
    }
    bestEl.textContent = stats[mode].best;
    recordDaily();
  }

  // ===== 配置判定 =====
  function canPlaceAt(shape, br, bc) {
    for (const [r, c] of shape.cells) {
      const rr = br + r, cc = bc + c;
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) return false;
      if (grid[rr][cc]) return false;
    }
    return true;
  }

  function canPlaceAnywhere(shape) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (canPlaceAt(shape, r, c)) return true;
    return false;
  }

  // 揃う行・列を求める（追加セル込みで判定）
  function findClears(extraCells = []) {
    const temp = grid.map(row => row.slice());
    for (const [r, c] of extraCells) temp[r][c] = '#fff';
    const rows = [], cols = [];
    for (let r = 0; r < SIZE; r++)
      if (temp[r].every(v => v)) rows.push(r);
    for (let c = 0; c < SIZE; c++) {
      let full = true;
      for (let r = 0; r < SIZE; r++) if (!temp[r][c]) { full = false; break; }
      if (full) cols.push(c);
    }
    return { rows, cols };
  }

  function clearSet(rows, cols) {
    const set = new Set();
    for (const r of rows) for (let c = 0; c < SIZE; c++) set.add(r + ',' + c);
    for (const c of cols) for (let r = 0; r < SIZE; r++) set.add(r + ',' + c);
    return set;
  }

  // ===== ピーストレイ =====
  function newTray() {
    trayEl.innerHTML = '';
    tray = [];
    for (let i = 0; i < 3; i++) {
      const shape = randomShape();
      const el = buildPieceEl(shape);
      trayEl.appendChild(el);
      const item = { shape, el, used: false };
      el.addEventListener('pointerdown', (e) => startDrag(e, item));
      tray.push(item);
    }
  }

  function buildPieceEl(shape) {
    const rows = Math.max(...shape.cells.map(c => c[0])) + 1;
    const cols = Math.max(...shape.cells.map(c => c[1])) + 1;
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.gridTemplateRows = `repeat(${rows}, var(--tray-cell))`;
    el.style.gridTemplateColumns = `repeat(${cols}, var(--tray-cell))`;
    const on = new Set(shape.cells.map(([r, c]) => r + ',' + c));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'piece-cell' + (on.has(r + ',' + c) ? ' on' : '');
        if (on.has(r + ',' + c)) cell.style.setProperty('--c', shape.color);
        el.appendChild(cell);
      }
    }
    return el;
  }

  function refreshTrayState() {
    for (const item of tray) {
      if (item.used) continue;
      item.el.classList.toggle('unplaceable', !canPlaceAnywhere(item.shape));
    }
  }

  // ===== ドラッグ処理 =====
  const ghost = document.createElement('div');
  ghost.id = 'drag-ghost';
  document.body.appendChild(ghost);
  ghost.style.display = 'none';

  let drag = null; // { item, offsetRows, offsetCols }

  function startDrag(e, item) {
    if (gameOver || item.used || drag) return;
    if (!canPlaceAnywhere(item.shape)) return; // 置けないピースは掴めない
    e.preventDefault();
    SFX.pick();

    const shape = item.shape;
    const rows = Math.max(...shape.cells.map(c => c[0])) + 1;
    const cols = Math.max(...shape.cells.map(c => c[1])) + 1;

    // ゴースト構築（盤面セルサイズで表示）
    ghost.innerHTML = '';
    ghost.style.gridTemplateRows = `repeat(${rows}, var(--cell))`;
    ghost.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
    const on = new Set(shape.cells.map(([r, c]) => r + ',' + c));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'ghost-cell' + (on.has(r + ',' + c) ? ' on' : '');
        if (on.has(r + ',' + c)) cell.style.setProperty('--c', shape.color);
        ghost.appendChild(cell);
      }
    }
    ghost.style.display = 'grid';
    item.el.classList.add('dragging');

    drag = { item, rows, cols, pointerId: e.pointerId };
    moveDrag(e);

    document.addEventListener('pointermove', moveDrag);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', cancelDrag);
  }

  // 指の少し上にピースを表示（指で隠れないように）
  const LIFT = 70;

  function ghostPosition(e) {
    const gapPx = 4;
    const w = drag.cols * CELL + (drag.cols - 1) * gapPx;
    const h = drag.rows * CELL + (drag.rows - 1) * gapPx;
    return { x: e.clientX - w / 2, y: e.clientY - h - LIFT + h / 2 };
  }

  function boardTarget(e) {
    const rect = boardEl.getBoundingClientRect();
    const pos = ghostPosition(e);
    const gapPx = 4;
    // ゴーストの左上セル中心が乗っている盤面セルを求める
    const gx = pos.x + CELL / 2 - rect.left - gapPx;
    const gy = pos.y + CELL / 2 - rect.top - gapPx;
    const c = Math.round(gx / (CELL + gapPx) - 0.5);
    const r = Math.round(gy / (CELL + gapPx) - 0.5);
    return { r, c };
  }

  function moveDrag(e) {
    if (!drag) return;
    const pos = ghostPosition(e);
    ghost.style.left = pos.x + 'px';
    ghost.style.top = pos.y + 'px';

    const { r, c } = boardTarget(e);
    const shape = drag.item.shape;
    if (canPlaceAt(shape, r, c)) {
      const cells = shape.cells.map(([sr, sc]) => [r + sr, c + sc]);
      const { rows, cols } = findClears(cells);
      renderBoard(cells, shape.color, clearSet(rows, cols));
      drag.target = { r, c };
    } else {
      renderBoard();
      drag.target = null;
    }
  }

  function endDrag(e) {
    if (!drag) return;
    const d = drag;
    cleanupDrag();
    if (d.target) {
      placePiece(d.item, d.target.r, d.target.c, e);
    } else {
      renderBoard();
    }
  }

  function cancelDrag() {
    if (!drag) return;
    cleanupDrag();
    renderBoard();
  }

  function cleanupDrag() {
    document.removeEventListener('pointermove', moveDrag);
    document.removeEventListener('pointerup', endDrag);
    document.removeEventListener('pointercancel', cancelDrag);
    ghost.style.display = 'none';
    if (drag) drag.item.el.classList.remove('dragging');
    drag = null;
  }

  // ===== 配置と消去 =====
  function placePiece(item, br, bc, e) {
    const shape = item.shape;
    const placed = shape.cells.map(([r, c]) => [br + r, bc + c]);
    for (const [r, c] of placed) grid[r][c] = shape.color;

    item.used = true;
    item.el.classList.add('used');

    let gained = placed.length; // 1マス = 1点

    const { rows, cols } = findClears();
    const lines = rows.length + cols.length;

    if (lines > 0) {
      combo++;
      const lineScore = lines * 10 * SIZE;      // 1ライン = 80点
      const comboBonus = (combo - 1) * 20;       // コンボボーナス
      gained += lineScore * (1 + (lines - 1) * 0.5) + comboBonus;
      gained = Math.round(gained);
      SFX.clear(lines, combo);
      showCombo(lines, combo);
      showComboPop(lines, combo);
      if (lines >= 2 || combo >= 3) {
        const bw = document.getElementById('board-wrap');
        bw.classList.remove('board-shake');
        void bw.offsetWidth;
        bw.classList.add('board-shake');
      }
      animateClear(rows, cols);
    } else {
      combo = 0;
      SFX.place();
      renderBoard();
    }

    score += gained;
    updateScore();
    if (e) showScorePop(gained, e.clientX, e.clientY - 80);

    // クリア判定（目標スコア達成・1ゲーム1回）
    if (!clearAchieved && score >= MODES[mode].clearTarget) {
      clearAchieved = true;
      onClearAchieved();
    }

    // 3つ使い切ったら補充
    if (tray.every(t => t.used)) {
      newTray();
    }
    // ライン消去中は盤面がまだ空いていないので、消去アニメ完了後（animateClear内）に判定する。
    // ここで判定すると「消えれば置けたはず」なのにゲームオーバーになってしまう。
    if (lines === 0) {
      refreshTrayState();
      checkGameOver();
    }
  }

  // 消去セルからカラフルなパーティクルを飛ばす
  function spawnParticles(set) {
    let count = 0;
    for (const key of set) {
      if (count >= 90) break;
      const [r, c] = key.split(',').map(Number);
      const color = grid[r][c];
      if (!color) continue;
      const rect = cellEls[r][c].getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 3; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.setProperty('--c', color);
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        const ang = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 70;
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
        p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 750);
        count++;
      }
    }
  }

  // 画面中央のド派手コンボ表示
  const comboPopEl = document.getElementById('combo-pop');
  function showComboPop(lines, comboCount) {
    let html = '';
    if (comboCount >= 2) html = icon(IMG.fire) + `${comboCount}コンボ!!`;
    else if (lines >= 2) html = icon(IMG.party) + `${lines}ライン同時消し!`;
    if (!html) return;
    comboPopEl.innerHTML = html;
    comboPopEl.classList.remove('show');
    void comboPopEl.offsetWidth;
    comboPopEl.classList.add('show');
  }

  function animateClear(rows, cols) {
    const set = clearSet(rows, cols);
    renderBoard();
    spawnParticles(set);
    for (const key of set) {
      const [r, c] = key.split(',').map(Number);
      cellEls[r][c].classList.add('clearing');
    }
    setTimeout(() => {
      for (const key of set) {
        const [r, c] = key.split(',').map(Number);
        grid[r][c] = null;
      }
      renderBoard();
      refreshTrayState();
      checkGameOver();
    }, 300);
  }

  function showCombo(lines, comboCount) {
    let html = lines >= 2 ? `${lines}ライン同時消し！` : 'ライン消し！';
    if (comboCount >= 2) html += icon(IMG.fire) + `${comboCount}コンボ`;
    comboEl.innerHTML = html;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(() => comboEl.classList.remove('show'), 1500);
  }

  function showScorePop(points, x, y) {
    const el = document.createElement('div');
    el.className = 'score-pop';
    el.textContent = '+' + points;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ===== クリア達成・モード解放 =====
  // 画像アイコン（絵文字のかわりに使う）
  const IMG = {
    fire: 'icon-fire.webp',
    party: 'icon-party.webp',
    gold: 'medal-gold.webp',
    silver: 'medal-silver.webp',
    bronze: 'medal-bronze.webp',
  };
  const icon = (f, cls) => `<img src="${f}"${cls ? ` class="${cls}"` : ''} alt="">`;

  // text は内部の固定文字列のみ渡すこと（外部入力は入れない）
  function showToast(text, iconFile) {
    toastEl.innerHTML = (iconFile ? icon(iconFile) : '') + text;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  function onClearAchieved() {
    const before = Object.keys(MODES).filter(isUnlocked);
    stats[mode].clears++;
    saveStats();
    SFX.goal();
    showToast('クリア達成！', IMG.party);
    const after = Object.keys(MODES).filter(isUnlocked);
    const news = after.filter(k => !before.includes(k));
    unlockedMsgs = news.map(k => `${MODES[k].name}モード解放！`);
    news.forEach((k, i) => setTimeout(() => {
      showToast(`${MODES[k].name}モード解放！`, MODES[k].img);
      SFX.unlock();
    }, 1600 * (i + 1)));
  }

  // ===== タイマー（タイムアタック） =====
  function fmtTime(t) {
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }

  function updateTitle() {
    const cfg = MODES[mode];
    if (cfg.timeLimit) {
      titleEl.classList.add('timer-mode');
      titleEl.textContent = '⏱️ ' + fmtTime(timeLeft);
      titleEl.classList.toggle('urgent', timeLeft <= 30);
    } else {
      titleEl.classList.remove('timer-mode', 'urgent');
      titleEl.innerHTML = cfg.titleHtml;
    }
  }

  // 壁時計ベースのタイマー（タブ非表示時のsetInterval間引きの影響を受けない）
  function startTimer() {
    stopTimer();
    if (!MODES[mode].timeLimit) return;
    deadline = Date.now() + remainingMs;
    timerId = setInterval(timerTick, 250);
  }

  function timerTick() {
    if (gameOver) { stopTimer(); return; }
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (left !== timeLeft) {
      timeLeft = left;
      updateTitle();
      if (left <= 10 && left > 0) SFX.tick(); // 残り10秒カウントダウン
    }
    if (left <= 0) {
      stopTimer();
      gameOver = true;
      cancelDrag();
      showGameOver(true);
    }
  }

  function pauseTimer() {
    if (timerId) {
      remainingMs = Math.max(0, deadline - Date.now());
      stopTimer();
    }
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  // ===== ゲームオーバー =====
  function checkGameOver() {
    if (gameOver) return;
    const remaining = tray.filter(t => !t.used);
    if (remaining.length === 0) return;
    const anyFits = remaining.some(t => canPlaceAnywhere(t.shape));
    if (!anyFits) {
      gameOver = true;
      setTimeout(showGameOver, 500);
    }
  }

  function showGameOver(isTimeUp = false) {
    stopTimer();
    gameActive = false;
    if (isTimeUp) SFX.timeup(); else SFX.over();
    const cfg = MODES[mode];
    document.getElementById('go-title').textContent = isTimeUp ? '⏱️ タイムアップ！' : 'ゲームオーバー';
    document.getElementById('go-mode').innerHTML = icon(cfg.img, 'mode-line-icon') + cfg.name + 'モード';
    document.getElementById('go-clear').style.display = clearAchieved ? '' : 'none';
    document.getElementById('final-score').textContent = score;
    const note = document.getElementById('best-note');
    note.textContent = score >= stats[mode].best && score > 0 ? '🎉 ベストスコア更新！' : `ベスト: ${stats[mode].best}`;
    document.getElementById('unlock-note').textContent = unlockedMsgs.length ? '🔓 ' + unlockedMsgs.join(' ／ ') : '';
    maybeShowRegister();
    backToResultBtn.classList.remove('show');
    overlayEl.classList.add('show');
  }

  // ===== ゲーム開始・モード選択 =====
  function addObstacles(n) {
    let placed = 0, guard = 0;
    while (placed < n && guard++ < 500) {
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      if (!grid[r][c]) { grid[r][c] = '#b0bec5'; placed++; }
    }
  }

  function startGame(k) {
    SFX.tap();
    mode = k;
    prevBest = stats[k].best;   // このゲームでの自己ベスト更新判定に使う
    menuEl.classList.add('hidden');
    overlayEl.classList.remove('show');
    rankingEl.classList.add('hidden');
    registerBox.classList.remove('show');
    backToResultBtn.classList.remove('show');
    myEntryKey = null;
    score = 0;
    combo = 0;
    gameOver = false;
    clearAchieved = false;
    unlockedMsgs = [];
    paused = false;
    gameActive = true;
    resetGrid();
    addObstacles(MODES[k].obstacles);
    renderBoard();
    updateScore();
    timeLeft = MODES[k].timeLimit;
    remainingMs = MODES[k].timeLimit * 1000;
    updateTitle();
    startTimer();
    newTray();
    refreshTrayState();
  }

  function renderMenu() {
    modeListEl.innerHTML = '';
    for (const k of Object.keys(MODES)) {
      const cfg = MODES[k];
      const unlocked = isUnlocked(k);
      const st = stats[k];
      const card = document.createElement('div');
      card.className = 'mode-card' + (unlocked ? '' : ' locked');
      const desc = unlocked
        ? cfg.desc
        : `🔒 どのモードでも合計${cfg.unlock.count}回クリアで解放（いま${totalClears()}回）`;
      const statLine = unlocked
        ? `ベスト ${st.best} ・ クリア ${st.clears}回 ・ 目標 ${cfg.clearTarget}点${cfg.timeLimit ? ' ・ ' + fmtTime(cfg.timeLimit) : ''}`
        : '';
      card.innerHTML =
        (cfg.img
          ? `<img class="mode-icon-img" src="${cfg.img}" alt="${cfg.name}">`
          : `<span class="mode-icon">${cfg.icon}</span>`) +
        `<span class="mode-info">` +
        `<div class="mode-name">${cfg.name}</div>` +
        `<div class="mode-desc">${desc}</div>` +
        (statLine ? `<div class="mode-stats">${statLine}</div>` : '') +
        `</span>`;
      card.addEventListener('click', () => {
        if (unlocked) startGame(k);
        else showToast(desc);
      });
      modeListEl.appendChild(card);
    }
  }

  function openMenu() {
    paused = true;
    pauseTimer();
    cancelDrag();
    backToResultBtn.classList.remove('show');
    renderMenu();
    resumeBtn.style.display = (gameActive && !gameOver) ? '' : 'none';
    menuEl.classList.remove('hidden');
  }

  function closeMenu() {
    if (!gameActive || gameOver) return;
    paused = false;
    menuEl.classList.add('hidden');
    startTimer();
  }

  document.getElementById('restart-btn').addEventListener('click', () => startGame(mode));
  document.getElementById('menu-btn').addEventListener('click', () => {
    overlayEl.classList.remove('show');
    openMenu();
  });
  document.getElementById('home-btn').addEventListener('click', openMenu);
  resumeBtn.addEventListener('click', closeMenu);
  document.getElementById('stats-btn').addEventListener('click', () => {
    renderChart();
    document.getElementById('stats').classList.remove('hidden');
  });
  document.getElementById('stats-close').addEventListener('click', () => {
    document.getElementById('stats').classList.add('hidden');
  });
  document.querySelectorAll('.chart-chip[data-f]').forEach(ch => {
    ch.addEventListener('click', () => {
      chartFilter = ch.dataset.f;
      renderChart();
    });
  });

  // ===== 開始 =====
  resetGrid();
  renderBoard();
  openMenu();

})();
</script>
<script>
// --- バージョン管理・更新通知（PWA） ---
const APP_VERSION = '2.1';
const RELEASE_NOTES = {
  '1.0': ['初版リリース'],
  '1.1': ['パステルカラーの新デザイン', 'ホーム画面に追加できるアプリ（PWA）対応'],
  '1.2': ['タイムアタック（3分）・ハード・ベリーハードの新モード追加', 'クリア回数で新モードが解放されるように'],
  '1.3': ['📊 過去7日間の日別ベストスコアグラフを追加', 'モードアイコンを一新', 'モード解放条件を調整（3回／5回／10回）'],
  '1.4': ['ホーム・スコア記録ボタンもかわいいアイコン画像に', '画像をWebP化して軽量化'],
  '1.5': ['🔊 効果音を追加（配置・ライン消去・クリア・カウントダウンなど）', '画面上部のスピーカーボタンでオン/オフ切替可能'],
  '1.6': ['✨ 消去音がもっと楽しく！コンボで音がどんどん豪華に', '🎆 連続消し・同時消しでパーティクルが飛び散る派手な演出を追加'],
  '1.7': ['🔓 モード解放の条件を緩和！どのモードのクリアも合計回数にカウントされるように'],
  '1.8': [
    '🏆 スコア登録＆ランキングを追加（ログイン不要・毎回すきな名前でOK）',
    '🔍 ゲームオーバー後に最後の盤面を確認できるように',
    '🐛 列が消えて続けられるのにゲームオーバーになる不具合を修正',
  ],
  '1.9': ['🌐 ランキングが全国のみんなと共通に！ 誰でもスコアを登録できます'],
  '2.0': ['✨ タイトルロゴとサウンドボタンをオリジナル画像に一新'],
  '2.1': ['🏅 ランキングのメダル、コンボの炎、クリアのクラッカーもオリジナル画像に', 'モード切替タブにもモードのアイコンを表示'],
};

// リロード後にリリースノートを表示
(function showReleaseNotesIfUpdated() {
  const lastVer = localStorage.getItem('tetris_puzzle_version');
  if (lastVer && lastVer !== APP_VERSION) {
    const title = document.getElementById('update-title');
    const ul = document.getElementById('update-changes');
    title.textContent = 'ver' + APP_VERSION + ' に更新されました';
    const notes = RELEASE_NOTES[APP_VERSION] || ['軽微な修正'];
    ul.innerHTML = notes.map((n) => '<li>' + n + '</li>').join('');
    document.querySelector('.update-btn-reload').style.display = 'none';
    document.querySelector('.update-btn-later').textContent = '閉じる';
    document.getElementById('update-banner').classList.add('show');
  }
  localStorage.setItem('tetris_puzzle_version', APP_VERSION);
})();

let waitingWorker = null;

function showUpdatePrompt() {
  const title = document.getElementById('update-title');
  const ul = document.getElementById('update-changes');
  title.textContent = '新しいバージョンが利用可能です';
  ul.innerHTML = '<li>「今すぐ更新」でリロードします</li>';
  document.querySelector('.update-btn-reload').style.display = '';
  document.querySelector('.update-btn-later').textContent = 'あとで';
  document.getElementById('update-banner').classList.add('show');
}

function applyUpdate() {
  if (waitingWorker) {
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  } else {
    window.location.reload();
  }
  document.getElementById('update-banner').classList.remove('show');
}

function dismissUpdate() {
  document.getElementById('update-banner').classList.remove('show');
}

// Service Worker Registration（更新検知付き）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      if (reg.waiting && navigator.serviceWorker.controller) {
        waitingWorker = reg.waiting;
        showUpdatePrompt();
      }
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            waitingWorker = newWorker;
            showUpdatePrompt();
          }
        });
      });
    }).catch((err) => {
      console.error('SW registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
</body>
